<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Redireccionando a Nido Finanzas...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.onload = function () {
            var query = window.location.search;
            var hash = window.location.hash;

            // Detectar si el usuario está en un dispositivo móvil
            var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isMobile) {
                // Redirigir a la app usando el esquema personalizado
                var appUrl = "com.adazix.nidofinanzas://login-callback" + query + hash;
                window.location.href = appUrl;

                // Fallback por si la app no está instalada o falla la redirección
                setTimeout(function () {
                    document.getElementById("message").innerHTML =
                        "Si la aplicación no se abrió automáticamente, asegúrate de tenerla instalada.<br><br>" +
                        "<a href='" + appUrl + "' class='btn'>Abrir Aplicación Manualmente</a>";
                }, 2500);
            } else {
                // Si está en el computador
                document.getElementById("message").innerHTML =
                    "<h2>Restablecimiento de Contraseña</h2>" +
                    "<p>Por favor, abre este correo electrónico y haz clic en el enlace <strong>desde tu teléfono celular</strong> para abrir la aplicación y poder cambiar tu contraseña.</p>";
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #121212;
            color: #ffffff;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #bb86fc;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            color: #e0e0e0;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #6200ee;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="message">Procesando enlace...</div>
    </div>
</body>

</html>
